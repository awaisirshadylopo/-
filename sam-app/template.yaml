  ######################## Scheduler Lambda ################
  StateMachneExecutionNameSetterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda_functions/mls/state-machine-execution-name-setter-func
      Handler: app.lambda_handler
      FunctionName: state-machine-execution-name-setter-func
      Description:
        This lambda triggers Statemachines and set there execution named on
        the basis of source type
      Runtime: python3.9
      Timeout: 180
      MemorySize: 128
      Role: !GetAtt mlsLambdaFunctionRole.Arn
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:580247275435:layer:LambdaInsightsExtension:14
        - !Ref awsWrangler
        - !Ref helperLayer
        - !Ref psycopg2

      Environment:
        Variables:
          state_machine_name: mls-unified-lmd-state-machine
      Events:
        TrestleSchedulerEvent:
          Type: ScheduleV2
          Properties:
            Name: lmd-TrestleAPI-statemachine-scheduler
            ScheduleExpression: rate(2 minute)
            State: DISABLED
            Description: Trestle API Unified LMD Flow State Machine Schedule Event
            Input: '{ "source_type": "Trestle API"}'
        TrestleInactiveSchedulerEvent:
          Type: ScheduleV2
          Properties:
            Name: inv-TrestleAPI-statemachine-scheduler
            ScheduleExpression: rate(15 minute)
            State: DISABLED
            Description: Trestle API Inactive Flow State Machine Schedule Event
            Input: '{ "source_type": "Trestle API",
              "state_machine_name": "unified-rets-inactive-state-machine"}'
        SparkSchedulerEvent:
          Type: ScheduleV2
          Properties:
            Name: lmd-SparkAPI-statemachine-scheduler
            ScheduleExpression: rate(2 minute)
            State: DISABLED
            Description: Spark API Unified LMD Flow State Machine Schedule Event
            Input: '{ "source_type": "Spark API"}'
        SparkInactiveSchedulerEvent:
          Type: ScheduleV2
          Properties:
            Name: inv-SparkAPI-statemachine-scheduler
            ScheduleExpression: rate(15 minute)
            State: DISABLED
            Description: Spark API Inactive Flow State Machine Schedule Event
            Input: '{ "source_type": "Spark API",
              "state_machine_name": "unified-rets-inactive-state-machine"}'
        BridgeSchedulerEvent:
          Type: ScheduleV2
          Properties:
            Name: lmd-BridgeAPI-statemachine-scheduler
            ScheduleExpression: rate(5 minute)
            State: DISABLED
            Description: Bridge API Unified LMD Flow State Machine Schedule Event
            Input: '{ "source_type": "Bridge API"}'
        BridgeInactiveSchedulerEvent:
          Type: ScheduleV2
          Properties:
            Name: inv-BridgeAPI-statemachine-scheduler
            ScheduleExpression: rate(15 minute)
            State: DISABLED
            Description: Bridge API Inactive Flow State Machine Schedule Event
            Input: '{ "source_type": "Bridge API",
              "state_machine_name": "unified-rets-inactive-state-machine"}'
        ParagonSchedulerEvent:
          Type: ScheduleV2
          Properties:
            Name: lmd-ParagonAPI-statemachine-scheduler
            ScheduleExpression: rate(10 minute)
            State: DISABLED
            Description: Paragon API Unified LMD Flow State Machine Schedule Event
            Input: '{ "source_type": "Paragon API"}'
        ParagonInactiveSchedulerEvent:
          Type: ScheduleV2
          Properties:
            Name: inv-ParagonAPI-statemachine-scheduler
            ScheduleExpression: rate(15 minute)
            State: DISABLED
            Description: Paragon API Inactive Flow State Machine Schedule Event
            Input: '{ "source_type": "Paragon API",
              "state_machine_name": "unified-rets-inactive-state-machine"}'
        MLSGridSchedulerEvent:
