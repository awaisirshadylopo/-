AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Parameters:
  securityGroup:
    Type: String

  subnet1:
    Type: String

  subnet2:
    Type: String

  listingDatabase:
    Type: String

  rdsDatabase:
    Type: String

  ###################### GLOBAL VARIABLES #####################

Globals:
  Function:
    VpcConfig:
      SecurityGroupIds:
        - !Ref securityGroup
      SubnetIds:
        - !Ref subnet1
        - !Ref subnet2

Resources:
  ####################### IAM ROLE #################################
  mlsLambdaFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mlsLambdaFunctionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MlsLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:ListSecrets
                  - secretsmanager:CreateSecret
                  - secretsmanager:UpdateSecret
                  - secretsmanager:DeleteSecret
                  - logs:*
                  - cloudwatch:*
                  - states:*
                  - lambda:InvokeFunction
                  - rds-data:*
                  - codeguru-profiler:*
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - "s3:*"
                  - "s3-object-lambda:*"
                  - "scheduler:ListScheduleGroups"
                  - "scheduler:ListSchedules"
                  - "scheduler:GetSchedule"
                  - "scheduler:GetScheduleGroup"
                  - "scheduler:UpdateSchedule"
                  - "iam:PassRole"
                  - "cognito-idp:AdminInitiateAuth"
                  - "glue:GetDatabase"
                  - "glue:GetTable"
                  - "glue:CreateTable"
                  - "glue:UpdateTable"
                  - "glue:GetPartitions"
                  - "glue:BatchCreatePartition"
                  - "glue:BatchUpdatePartition"
                  - "glue:GetDatabases"
                  - "glue:GetTables"
                  - "athena:StartQueryExecution"
                  - "athena:GetQueryExecution"
                  - "athena:GetQueryResults"
                  - "athena:StopQueryExecution"
                  - "athena:GetWorkGroup"
                  - "athena:ListWorkGroups"
                Resource: "*"

  mlsStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: states.amazonaws.com
      Policies:
        - PolicyName: mlsStateMachineRole
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: "*"
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: "*"

  ###################### LAYERS #####################
  awsWrangler:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/awswrangler/wrangler.zip
      CompatibleRuntimes:
        - python3.9

  helperLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/helperLayer/helperLayer.zip
      CompatibleRuntimes:
        - python3.9

  psycopg2:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/psycopg2/pyscopg2.zip
      CompatibleRuntimes:
        - python3.9

  requests:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/requests/requests.zip
      CompatibleRuntimes:
        - python3.9
  polars:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/polars/polars.zip
      CompatibleRuntimes:
        - python3.12

