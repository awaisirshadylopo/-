
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Parameters:
  securityGroup:
    Type: String

  subnet1:
    Type: String

  subnet2:
    Type: String

  listingDatabase:
    Type: String

  rdsDatabase:
    Type: String

  mlsLambdaFunctionRole:
    Type: String

Globals:
  Function:
    VpcConfig:
      SecurityGroupIds:
        - !Ref securityGroup
      SubnetIds:
        - !Ref subnet1
        - !Ref subnet2

Resources:
  FlexMlsRetsDataDownloadingLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: flexmls-rets-active-data-download-func
      Handler: app.lambda_handler
      FunctionName: flexmls-rets-active-data-download-func
      Description: "This lambda downloads data from the source and dumps it into pre-stage tables."
      Runtime: python3.12
      Timeout: 900
      MemorySize: 1024
      Role: !Ref mlsLambdaFunctionRole      
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:336392948345:layer:AWSSDKPandas-Python312:16"
        - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:1"

      Environment:
        Variables:
          listingDatabase: !Ref listingDatabase
          rdsDatabase: !Ref rdsDatabase
          bucket_name: !Sub idx-data-lake-${AWS::AccountId}-${AWS::Region}
  FlexMlsRetsDataDownloadingLambdaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: FlexMlsRetsDataDownloadingLambdaFunction
    Properties:
      LogGroupName:
        !Join ["", ["/aws/lambda/", !Ref FlexMlsRetsDataDownloadingLambdaFunction]]
      RetentionInDays: 90


  FlexMlsRetsMetaDataDownloadLambdaFunction:
      Type: AWS::Serverless::Function
      Properties:
        CodeUri: flexmls-rets-metadata-download-func
        Handler: app.lambda_handler
        FunctionName: flexmls-rets-metadata-download-func
        Description: "This lambda download the metadata."
        Runtime: python3.12
        Timeout: 300
        MemorySize: 256
        Role: !Ref mlsLambdaFunctionRole
        
        Layers:
          - !Sub "arn:aws:lambda:${AWS::Region}:336392948345:layer:AWSSDKPandas-Python312:16"
          - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:1"

        Environment:
          Variables:
            listingDatabase: !Ref listingDatabase
            rdsDatabase: !Ref rdsDatabase
  FlexMlsRetsMetaDataDownloadLambdaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: FlexMlsRetsMetaDataDownloadLambdaFunction
    Properties:
      LogGroupName:
        !Join ["", ["/aws/lambda/", !Ref FlexMlsRetsMetaDataDownloadLambdaFunction]]
      RetentionInDays: 90

