
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Parameters:
  securityGroup:
    Type: String

  subnet1:
    Type: String

  subnet2:
    Type: String

  listingDatabase:
    Type: String

  rdsDatabase:
    Type: String

  mlsLambdaFunctionRole:
    Type: String

Globals:
  Function:
    VpcConfig:
      SecurityGroupIds:
        - !Ref securityGroup
      SubnetIds:
        - !Ref subnet1
        - !Ref subnet2

Resources:
  ConnectMlsRetsActiveDataDownloadingLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: connectmls-rets-active-data-download-func
      Handler: app.lambda_handler
      FunctionName: connectmls-rets-active-data-download-func
      Description: "This lambda downloads data from the source and dumps it into pre-stage tables."
      Runtime: python3.12
      Timeout: 900
      MemorySize: 1024
      Role: !Ref mlsLambdaFunctionRole      
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:336392948345:layer:AWSSDKPandas-Python312:16"
        - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:1"
      Environment:
        Variables:
          listingDatabase: !Ref listingDatabase
          rdsDatabase: !Ref rdsDatabase
          bucket_name: !Sub idx-data-lake-${AWS::AccountId}-${AWS::Region}
  ConnectMlsRetsActiveDataDownloadingLambdaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: ConnectMlsRetsActiveDataDownloadingLambdaFunction
    Properties:
      LogGroupName:
        !Join ["", ["/aws/lambda/", !Ref ConnectMlsRetsActiveDataDownloadingLambdaFunction]]
      RetentionInDays: 90


  ConnectMlsRetsMetaDataDownloadLambdaFunction:
      Type: AWS::Serverless::Function
      Properties:
        CodeUri: connectmls-rets-metadata-download-func
        Handler: app.lambda_handler
        FunctionName: connectmls-rets-metadata-download-func
        Description: "This lambda download the metadata."
        Runtime: python3.12
        Timeout: 300
        MemorySize: 256
        Role: !Ref mlsLambdaFunctionRole
        
        Layers:
          - !Sub "arn:aws:lambda:${AWS::Region}:336392948345:layer:AWSSDKPandas-Python312:16"
          - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:1"

        Environment:
          Variables:
            listingDatabase: !Ref listingDatabase
            rdsDatabase: !Ref rdsDatabase
  ConnectMlsRetsMetaDataDownloadLambdaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: ConnectMlsRetsMetaDataDownloadLambdaFunction
    Properties:
      LogGroupName:
        !Join ["", ["/aws/lambda/", !Ref ConnectMlsRetsMetaDataDownloadLambdaFunction]]
      RetentionInDays: 90

