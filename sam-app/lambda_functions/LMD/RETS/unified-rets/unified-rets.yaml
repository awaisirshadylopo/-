# ==============================================================================
# File: template.yaml
# Description: Creation of Abc Rets Specific Lambda Functions
# User: msanaullah
# Last Updated: 2025-07-14
# ==============================================================================

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Parameters:
  securityGroup:
    Type: String

  subnet1:
    Type: String

  subnet2:
    Type: String

  listingDatabase:
    Type: String

  rdsDatabase:
    Type: String
  
  polars:
    Type: String

  mlsLambdaFunctionRole:
    Type: String

Globals:
  Function:
    VpcConfig:
      SecurityGroupIds:
        - !Ref securityGroup
      SubnetIds:
        - !Ref subnet1
        - !Ref subnet2

Resources:
  UnifiedRetsDataDownloadLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: unified-rets-active-data-download-func
      Handler: app.lambda_handler
      FunctionName: unified-rets-active-data-download-func
      Description: "This lambda downloads data from the source and dumps it into pre-stage tables."
      Runtime: python3.12
      Timeout: 900
      MemorySize: 1024
      Role: !Ref mlsLambdaFunctionRole
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:336392948345:layer:AWSSDKPandas-Python312:16"
        # - !Ref polars
        - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:1"
      Environment:
        Variables:
          listingDatabase: !Ref listingDatabase
          rdsDatabase: !Ref rdsDatabase
          bucket_name: !Sub idx-data-lake-${AWS::AccountId}-${AWS::Region}

  UnifiedRetsDataDownloadLambdaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: UnifiedRetsDataDownloadLambdaFunction
    Properties:
      LogGroupName:
        !Join [
          "",
          ["/aws/lambda/", !Ref UnifiedRetsDataDownloadLambdaFunction],
        ]
      RetentionInDays: 90

  UnifiedRetsMetaDataDownloadLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: unified-rets-metadata-download-func
      Handler: app.lambda_handler
      FunctionName: unified-rets-metadata-download-func
      Description: "This lambda downloads metadata from the source and dumps it into dev Schema tables."
      Runtime: python3.12
      Timeout: 600
      MemorySize: 512
      Role: !Ref mlsLambdaFunctionRole
      Layers:
        # - !Sub "arn:aws:lambda:${AWS::Region}:336392948345:layer:AWSSDKPandas-Python312:16"
        - !Ref polars
        - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:1"
      Environment:
        Variables:
          listingDatabase: !Ref listingDatabase
          rdsDatabase: !Ref rdsDatabase

  UnifiedRetsMetaDataDownloadLambdaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: UnifiedRetsMetaDataDownloadLambdaFunction
    Properties:
      LogGroupName:
        !Join [
          "",
          ["/aws/lambda/", !Ref UnifiedRetsMetaDataDownloadLambdaFunction],
        ]
      RetentionInDays: 90
