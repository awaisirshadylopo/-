
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Parameters:
  securityGroup:
    Type: String

  subnet1:
    Type: String

  subnet2:
    Type: String

  listingDatabase:
    Type: String

  rdsDatabase:
    Type: String
  
  mlsLambdaFunctionRole:
    Type: String

Resources:
  SlackAlertLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: slack-alert-func
      Handler: app.lambda_handler
      FunctionName: slack-alert-func
      Description: "This lambda function use to send slack alert in 'idx-criticle-alert' channel."
      Runtime: python3.12
      Timeout: 300
      MemorySize: 256
      Role: !Ref mlsLambdaFunctionRole
      VpcConfig:
        SecurityGroupIds:
          - !Ref securityGroup
        SubnetIds:
          - !Ref subnet1
          - !Ref subnet2
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:336392948345:layer:AWSSDKPandas-Python312:16"
        - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:1"

      Environment:
        Variables:
          listingDatabase: !Ref listingDatabase
          rdsDatabase: !Ref rdsDatabase
          slackAlert: "ylopo/slack/alert"
      Events:
        SlackAlertSchedulerEvent:
          Type: ScheduleV2
          Properties:
            Name: ops-SlackAlert-lambda-scheduler
            ScheduleExpression: rate(15 minute)
            State: DISABLED
            Description: Slack Alert Schedule Event to trigger Slack Alert Lambda Function.

  SlackAlertLambdaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: SlackAlertLambdaFunction
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SlackAlertLambdaFunction}"
      RetentionInDays: 90


Outputs:
  SlackAlertLambdaFunction:
    Description: "SlackAlertLambdaFunction"
    Value: !GetAtt SlackAlertLambdaFunction.Arn