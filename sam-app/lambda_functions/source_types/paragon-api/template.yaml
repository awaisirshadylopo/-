# ==============================================================================
# File: template.yaml
# Description: Creation of Spark Specific Lambda Functions
# Author: msanaullah
# Last Updated: 2025-01-15
# ==============================================================================

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Parameters:
  securityGroup:
    Type: String

  subnet1:
    Type: String

  subnet2:
    Type: String

  listingDatabase:
    Type: String

  rdsDatabase:
    Type: String

  mlsLambdaFunctionRole:
    Type: String


Resources:
  ParagonInactiveDataDownloadLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: paragon-inactive-data-download-func
      Handler: app.lambda_handler
      FunctionName: paragon-inactive-data-download-func
      Description: "This lambda downloads data from the source and dumps it into pre-stage tables."
      Runtime: python3.12
      Timeout: 900
      MemorySize: 1024
      Role: !Ref mlsLambdaFunctionRole
      VpcConfig:
        SecurityGroupIds:
          - !Ref securityGroup
        SubnetIds:
          - !Ref subnet1
          - !Ref subnet2
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:336392948345:layer:AWSSDKPandas-Python312:16"
        - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:1"

      Environment:
        Variables:
          listingDatabase: !Ref listingDatabase
          rdsDatabase: !Ref rdsDatabase
          bucket_name: !Sub idx-data-lake-${AWS::AccountId}-${AWS::Region}
  ParagonInactiveDataDownloadLambdaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: ParagonInactiveDataDownloadLambdaFunction
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ParagonInactiveDataDownloadLambdaFunction}"
      RetentionInDays: 90
  
  ParagonMissingSoldDateUtilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: paragon-missing-sold-date-utility-func
      Handler: app.lambda_handler
      FunctionName: paragon-missing-sold-date-utility-func
      Description: "This Lambda function download and update missing sold_date and sold_price fields in the database."
      Runtime: python3.12
      Timeout: 900
      MemorySize: 256
      Role: !Ref mlsLambdaFunctionRole
      VpcConfig:
        SecurityGroupIds:
          - !Ref securityGroup
        SubnetIds:
          - !Ref subnet1
          - !Ref subnet2
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:336392948345:layer:AWSSDKPandas-Python312:16"
        - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:1"

      Environment:
        Variables:
          listingDatabase: !Ref listingDatabase
          rdsDatabase: !Ref rdsDatabase

  ParagonMissingSoldDateUtilityFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: ParagonMissingSoldDateUtilityFunction
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ParagonMissingSoldDateUtilityFunction}"
      RetentionInDays: 90
  
  ParagonMetadataDownloadUtilityLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: paragon-metadata-download-func
      Handler: app.lambda_handler
      FunctionName: paragon-metadata-download-func
      Description: "This lambda fetches metadata records from source and dumps into DB"
      Runtime: python3.12
      Timeout: 900
      MemorySize: 1024
      Role: !Ref mlsLambdaFunctionRole
      VpcConfig:
        SecurityGroupIds:
          - !Ref securityGroup
        SubnetIds:
          - !Ref subnet1
          - !Ref subnet2
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:336392948345:layer:AWSSDKPandas-Python312:16"
        - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:1"
      Environment:
        Variables:
          listingDatabase: !Ref listingDatabase
          rdsDatabase: !Ref rdsDatabase

  ParagonMetadataDownloadUtilityLambdaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ParagonMetadataDownloadUtilityLambdaFunction}"
      RetentionInDays: 90
