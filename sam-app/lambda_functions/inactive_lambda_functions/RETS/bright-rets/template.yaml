
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Parameters:
  securityGroup:
    Type: String

  subnet1:
    Type: String

  subnet2:
    Type: String

  listingDatabase:
    Type: String

  rdsDatabase:
    Type: String

  mlsLambdaFunctionRole:
    Type: String


Resources:
  BrightRetsInactiveDataDownloadLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: BrightRetsInactiveDataDownloadLambdaFunction
      Handler: app.lambda_handler
      FunctionName: bright-rets-inactive-data-download-func
      Description: "This lambda downloads data from the source and dumps it into pre-stage tables."
      Runtime: python3.12
      Timeout: 900
      MemorySize: 512
      Role: !Ref mlsLambdaFunctionRole
      VpcConfig:
        SecurityGroupIds:
          - !Ref securityGroup
        SubnetIds:
          - !Ref subnet1
          - !Ref subnet2
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:336392948345:layer:AWSSDKPandas-Python312:16"
        - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:1"

      Environment:
        Variables:
          listingDatabase: !Ref listingDatabase
          rdsDatabase: !Ref rdsDatabase

  BrightRetsInactiveDataDownloadLambdaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: BrightRetsInactiveDataDownloadLambda
    Properties:
      LogGroupName: !Sub "/aws/lambda/${BrightRetsInactiveDataDownloadLambda}"
      RetentionInDays: 90


Outputs:
  BrightRetsInactiveDataDownloadLambda:
    Description: "BrightRetsInactiveDataDownloadLambda"
    Value: !GetAtt BrightRetsInactiveDataDownloadLambda.Arn