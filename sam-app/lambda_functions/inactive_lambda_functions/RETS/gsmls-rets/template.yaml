# Description: Creation of Abc Rets Specific Lambda Functions
# User: msanaullah
# Last Updated: 2025-07-14
# ==============================================================================

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Parameters:
  securityGroup:
    Type: String

  subnet1:
    Type: String

  subnet2:
    Type: String

  listingDatabase:
    Type: String

  rdsDatabase:
    Type: String

  mlsLambdaFunctionRole:
    Type: String

Globals:
  Function:
    VpcConfig:
      SecurityGroupIds:
        - !Ref securityGroup
      SubnetIds:
        - !Ref subnet1
        - !Ref subnet2

Resources:
  GSMLSRetsInactiveDataDownloadingLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: gsmls-rets-inactive-data-download-func
      Description: "This lambda downloads data from the source and dumps it into pre-stage tables."
      Timeout: 900
      MemorySize: 1024
      Role: !Ref mlsLambdaFunctionRole
      ImageUri: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/mls-lambda-images:gsmls-rets-inactive-data-download-lambda-image-v13"
      Environment:
        Variables:
          listingDatabase: !Ref listingDatabase
          rdsDatabase: !Ref rdsDatabase
  GSMLSRetsInactiveDataDownloadingLambdaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: GSMLSRetsInactiveDataDownloadingLambdaFunction
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GSMLSRetsInactiveDataDownloadingLambdaFunction}"
      RetentionInDays: 90