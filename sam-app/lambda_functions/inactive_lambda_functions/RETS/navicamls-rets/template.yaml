# ==============================================================================
# File: template.yaml
# Description: Creation of Listhub Specific Lambda Functions
# Author: Usama Javed
# Last Updated: 2025-10-28
# ==============================================================================

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Parameters:
  securityGroup:
    Type: String

  subnet1:
    Type: String

  subnet2:
    Type: String

  listingDatabase:
    Type: String

  rdsDatabase:
    Type: String

  mlsLambdaFunctionRole:
    Type: String


Resources:
  NavicamlsRetsInactiveDataDownloadLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: navicamls-rets-inactive-data-download-func
      Handler: app.lambda_handler
      FunctionName: navicamls-rets-inactive-data-download-func
      Description: "This lambda downloads data from the source and dumps it into pre-stage tables."
      Runtime: python3.12
      Timeout: 900
      MemorySize: 512
      Role: !Ref mlsLambdaFunctionRole
      VpcConfig:
        SecurityGroupIds:
          - !Ref securityGroup
        SubnetIds:
          - !Ref subnet1
          - !Ref subnet2
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:336392948345:layer:AWSSDKPandas-Python312:16"
        - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:1"

      Environment:
        Variables:
          listingDatabase: !Ref listingDatabase
          rdsDatabase: !Ref rdsDatabase
  NavicamlsRetsInactiveDataDownloadLambdaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: NavicamlsRetsInactiveDataDownloadLambdaFunction
    Properties:
      LogGroupName:
        !Join ["", ["/aws/lambda/", !Ref NavicamlsRetsInactiveDataDownloadLambdaFunction]]
      RetentionInDays: 90


Outputs:
  NavicamlsRetsInactiveDataDownloadLambdaFunction:
    Description: "NavicamlsRetsInactiveDataDownloadLambdaFunction"
    Value: !GetAtt NavicamlsRetsInactiveDataDownloadLambdaFunction.Arn