  # API Gateway URL
  ApiGatewayUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${SchedulerApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
    Export:
      Name: !Sub "${AWS::StackName}-ApiGatewayUrl"

  # Cognito User Pool ID
  UserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref SchedulerApiUserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"

  # Cognito User Pool Client ID
  UserPoolClientId:
    Description: "Cognito User Pool Client ID"
    Value: !Ref SchedulerApiUserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolClientId"

  # Cognito User Pool Domain
  UserPoolDomain:
    Description: "Cognito User Pool Domain"
    Value: !Sub "https://${SchedulerApiUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolDomain"

  # Cognito Hosted UI URL
  CognitoHostedUIUrl:
    Description: "Cognito Hosted UI URL for authentication"
    Value: !Sub |
      https://${SchedulerApiUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/login?client_id=${SchedulerApiUserPoolClient}&response_type=code&scope=email+openid+profile&redirect_uri=https://localhost:3000/callback
    Export:
      Name: !Sub "${AWS::StackName}-CognitoHostedUIUrl"
